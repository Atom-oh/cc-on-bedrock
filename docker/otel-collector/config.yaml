# OpenTelemetry Collector (contrib) — central push endpoint for Claude Code native
# OTEL on Bedrock (P1).
#
# Topology: Claude Code (EC2 devenv) --OTLP/gRPC--> this collector
#   metrics --awss3(otlp-metrics/)--> otel_raw bucket --S3 event--> otel-metrics-rollup
#   logs    --filter+SCRUB--> awss3(otlp-logs/)--> otel_raw bucket --S3 event--> rollup
#
# DLP (ADR-009 no-content): native tool_result/tool_decision events carry a
# `tool_parameters` JSON string with bash commands / file paths / inputs, and other
# events (user_prompt) carry full prompt text. The logs pipeline KEEPS ONLY
# tool_result/tool_decision, lifts skill_name/subagent_type to top-level attributes,
# then deletes the raw tool_parameters/tool_input so nothing sensitive reaches S3.
# Bucket + region are injected via container env.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  cumulativetodelta: {}
  batch:
    timeout: 30s
    send_batch_size: 1000

  # Keep ONLY per-invocation tool usage events (tool_result/tool_decision), dropping
  # user_prompt/api_request/hook/plugin/mcp events (which carry prompts, responses, and
  # other high-cardinality content). Key on the tool_name attribute rather than
  # event.name: only tool_result/tool_decision carry tool_name, and this is robust to
  # whether the event name lands in attributes["event.name"] or the LogRecord event_name
  # field (OTLP versions differ; event.name-based filtering silently dropped everything).
  filter/tool_events:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["tool_name"] == nil'

  # DLP scrub: lift the only fields the rollup needs out of the tool_parameters JSON
  # string, then delete the raw bag and any other sensitive payload.
  transform/scrub:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # Lift the only two identifiers the rollup needs out of the tool_parameters JSON
          # string, then KEEP-ONLY an allowlist (break-closed): anything not explicitly
          # listed — tool_parameters, tool_input, prompt, response, future fields — is
          # dropped, so no bash command / file path / prompt can ever reach S3 (ADR-009).
          - set(attributes["skill_name"], ParseJSON(attributes["tool_parameters"])["skill_name"]) where attributes["tool_parameters"] != nil
          - set(attributes["subagent_type"], ParseJSON(attributes["tool_parameters"])["subagent_type"]) where attributes["tool_parameters"] != nil
          - keep_keys(attributes, ["event.name", "tool_name", "skill_name", "subagent_type", "decision", "success", "duration_ms", "enduser.id", "session.id", "cc.department", "cc.mode"])
          - set(body, "")

exporters:
  awss3/metrics:
    s3uploader:
      region: ${env:AWS_REGION}
      s3_bucket: ${env:OTEL_S3_BUCKET}
      s3_prefix: otlp-metrics
      file_prefix: metrics
    marshaler: otlp_json
  awss3/logs:
    s3uploader:
      region: ${env:AWS_REGION}
      s3_bucket: ${env:OTEL_S3_BUCKET}
      s3_prefix: otlp-logs
      file_prefix: logs
    marshaler: otlp_json

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, cumulativetodelta, batch]
      exporters: [awss3/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/tool_events, transform/scrub, batch]
      exporters: [awss3/logs]
