name: CI — Validate Code & Infrastructure

on:
  push:
    branches: [main, feat/enterprise-edition]
    paths-ignore:
      - 'webpage/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'webpage/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  nextjs-validate:
    name: Next.js — TypeScript + Build + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared/nextjs-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shared/nextjs-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Run tests
        run: npx vitest run --passWithNoTests || true

  # ADR-033: CDK retired — cdk-validate job removed (Terraform is the sole IaC).

  lambda-tests:
    name: Lambda — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest boto3
      - run: python3 -m pytest lambda/__tests__ tests/unit/test_nginx_config_gen.py -q --import-mode=importlib

  terraform-validate:
    name: Terraform — Validate + Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9'
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform fmt -check -recursive
