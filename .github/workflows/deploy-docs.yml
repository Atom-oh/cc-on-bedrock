name: Deploy webpage (Next.js static export) to GitHub Pages

on:
  push:
    branches: [main, feat/enterprise-edition]
    paths:
      - 'webpage/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webpage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webpage/package-lock.json

      - name: Install dependencies
        # `npm ci` falls back to `npm install` if lockfile is missing.
        # The initial Next.js rewrite (v2.0) ships without a committed
        # package-lock.json; CI installs fresh and the resulting lockfile
        # is regenerated each run.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build (Next.js static export → ./out/)
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: webpage/out
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
