name: PR review protocol tests

on:
  pull_request:
    paths:
      - 'scripts/pr-review/**'
      - '.github/workflows/pr-review*.yml'
      - 'tests/unit/test-pr-review-panel.sh'
  push:
    branches: [main]
    paths:
      - 'scripts/pr-review/**'
      - '.github/workflows/pr-review*.yml'
      - 'tests/unit/test-pr-review-panel.sh'

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test current and retained review protocols without provider calls
        run: python3 -m unittest discover -s scripts/pr-review -p 'test_*.py' -v
      - name: Check shell syntax
        run: |
          bash -n scripts/pr-review/run-panel.sh scripts/pr-review/synthesize.sh \
            scripts/pr-review/lib.sh scripts/pr-review/run-specialists.sh
