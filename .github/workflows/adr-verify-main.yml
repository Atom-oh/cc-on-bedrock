# .github/workflows/adr-verify-main.yml
# Re-runs the ADR Tier 1 static check after every push to main and, if any
# ADR fails, files a labelled GitHub issue summarizing the drift so the
# `issue-auto-implement` workflow can pick it up and open a Draft fix PR.
#
# Designed to catch the gap that PR-time checks can't see:
#   - merge-base drift (a passing PR can race with another that just merged)
#   - direct ADR or code edits that bypass PR (rare, but possible on admins)
#   - tier1_static rule changes that retroactively invalidate `main`
#
# This workflow ONLY signals (creates an issue). Self-healing happens in
# `issue-auto-implement.yml` triggered by `issues: types: [opened]`.

name: ADR Compliance (main re-verify)

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: adr-verify-main
  cancel-in-progress: false   # serialize; do not lose a failure window

jobs:
  reverify:
    name: ADR Tier 1 (main)
    runs-on: cc-bedrock-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install adrverify
        working-directory: .adr-verify
        run: pip install -e .

      - name: Run Tier 1 static (non-blocking — capture exit)
        id: tier1
        run: |
          # tier1_static exits non-zero on any failure; capture it so the
          # next step can decide whether to file an issue.
          set +e
          python -m adrverify.tier1_static \
            --repo-root . \
            --decisions-dir docs/decisions \
            --output tier1.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Build issue body from tier1.json
        id: body
        if: steps.tier1.outputs.exit != '0'
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 <<'PY'
          import json, os, textwrap
          with open("tier1.json") as f:
              data = json.load(f)

          failed = [
              a for a in data["adrs"]
              if a["tier1_static"]["status"] == "fail"
          ]
          # Group by ADR for readable rendering
          lines = []
          lines.append(f"main에 push된 commit [`{os.environ['COMMIT_SHA'][:7]}`]({os.environ['COMMIT_URL']})에서 ADR Tier 1 정적 검증이 실패했습니다.\n")
          lines.append(f"워크플로 실행: {os.environ['RUN_URL']}\n")
          lines.append(f"## 실패한 ADR ({len(failed)}건)\n")

          for adr in failed:
              aid = adr["adr_id"]
              t1 = adr["tier1_static"]
              lines.append(f"### {aid}\n")
              if "error" in t1:
                  lines.append(f"- error: `{t1['error']}`\n")
              for chk in t1.get("checks", []):
                  if chk["result"] == "fail":
                      lines.append(
                          f"- `{chk['path']}` rule=`{chk['rule']}` value=`{chk['value']}`\n"
                          f"  - evidence: `{chk['evidence']}`"
                      )
              lines.append("")

          lines.append("## 자동 수정 가이드 (Claude Code)\n")
          lines.append(textwrap.dedent("""
              실패 원인은 보통 두 가지 중 하나입니다:

              1. **코드가 ADR 요구사항을 위반** — 코드 수정으로 ADR 충족
              2. **ADR Verification 블록이 현재 코드와 불일치** — ADR Verification 룰 갱신 또는 코드 보정

              이 issue는 `issue-auto-implement` 워크플로가 자동 트리거하여 Draft PR로 변환합니다.
              사람이 `needs-triage` 라벨을 해제하고 PR을 Ready로 승급하면 정식 리뷰가 시작됩니다.
              """).strip())
          lines.append("\n---\n🤖 Auto-generated by `adr-verify-main.yml`")

          body = "\n".join(lines)
          # Stash for the next step. write to a file so multiline body survives.
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("title=[ADR Compliance] " + str(len(failed)) + "건 검증 실패 on `" + os.environ["COMMIT_SHA"][:7] + "`\n")
          with open("/tmp/issue-body.md", "w") as f:
              f.write(body)
          print(f"Built issue body: {len(body)} bytes for {len(failed)} failed ADRs")
          PY

      - name: Create issue (uses PAT so issue-auto-implement triggers)
        if: steps.tier1.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_BOT_PAT }}
          REPO: ${{ github.repository }}
          ISSUE_TITLE: ${{ steps.body.outputs.title }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CLAUDE_BOT_PAT secret missing — issue cannot trigger downstream workflow"
            echo "Falling back to default GITHUB_TOKEN; issue will be created but chain will break."
            export GH_TOKEN="${{ github.token }}"
          fi
          gh issue create \
            --repo "$REPO" \
            --title "$ISSUE_TITLE" \
            --label adr-fail \
            --body-file /tmp/issue-body.md
