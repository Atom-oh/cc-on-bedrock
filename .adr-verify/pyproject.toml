# .adr-verify/pyproject.toml
[project]
name = "adrverify"
version = "0.1.0"
description = "ADR compliance pipeline for cc-on-bedrock"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "boto3>=1.34",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"
